[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crazyflie-rover-landing"
version = "0.1.0"
description = "Cooperative drone-landing-on-rover task using ACMPC with LEAP-C."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.15.2",
    "jax>=0.7.0",
    "casadi>=3.7.0",
    "gymnasium>=1.1.1",
    "ruamel.yaml",
]

[project.optional-dependencies]
learning = ["torch>=2.0.0", "skrl>=1.0.0"]
gpu = ["jax[cuda12]"]

[tool.setuptools.packages]
find = {include = ["crazyflie_rover_landing*"]}
