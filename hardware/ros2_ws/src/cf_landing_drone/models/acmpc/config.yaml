environment:
  rover_type: "x3"
  drone_model: "cf21B_500"
  dynamics: "first_principles"
  sim_freq: 500
  mellinger_freq: 500
  control_freq: 50
  episode_length_s: 25.0
  map_size_x: 15.0
  map_size_y: 15.0
  drone_z_min: 0.0
  drone_z_max: 3.0
  # RosMaster X3 mecanum rover limits
  rover_vx_max: 1.0            # m/s   (ROS /cmd_vel forward limit)
  rover_vy_max: 1.0            # m/s   (ROS /cmd_vel lateral limit)
  rover_wz_max: 5.0            # rad/s (ROS /cmd_vel yaw rate limit)
  rover_wheel_vel_max: 34.9    # rad/s (333 RPM motor with 1:30 gear ratio)
  rover_platform_radius: 0.127  # m — 254mm square pad (inscribed circle radius)
  landing_zone_radius: 0.05   # m — safe landing zone (edge landings = crash)
  rover_height: 0.213          # height of landing pad surface above ground [m] (custom 3D printed pad on bracket)
  landing_z_tol: 0.05          # m — must be very close to pad surface
  landing_vel_xy_tol: 0.1     # m/s — relative to rover pad
  landing_vel_z_tol: 0.1      # m/s — max descent speed (upward rejected)
  landing_attitude_tol: 0.05  # rad (~3°) — must be nearly level
  drone_init_yaw_max: 0.1745  # rad (~10°) — random initial yaw at spawn
  # Ground effect (per-rotor, surface-aware)
  enable_ground_effect: true
  ground_effect_rotor_radius: 0.0275  # m — 55mm prop diameter / 2
  ground_effect_scale: 1.5            # overestimate for sim-to-real robustness
  # domain randomization parameters (applied only in "domain_rand" curriculum level)
  randomize_mass: false
  randomize_inertia: false
  mass_randomization_std: 0.003       # [kg]
  inertia_randomization_std: 3.0e-6   # [kg*m^2]
  enable_disturbance: false
  disturbance_force_std: 0.01         # [N]
  disturbance_torque_std: 1.0e-4      # [Nm]
  # Landing corridor
  corridor_radius: 0.3       # m — horizontal distance to activate landing phase
  corridor_transition: 0.1   # m — sigmoid blend width
  max_descent_speed: 0.3     # m/s — max descent speed in corridor
  max_drone_speed: 0.6       # m/s — drone speed above this gets penalized

rewards:
  landing: 100.0
  crash: -50.0
  boundary: -50.0
  progress_coef: 10.0
  angle_coef: 0.01
  action_smoothness_thrust: 1.0
  action_smoothness_rpy: 0.2
  action_smoothness_wheel: 0.001   # burger only (ignored for x3)
  action_smoothness_vx: 0.03      # x3: forward velocity smoothness
  action_smoothness_vy: 0.03      # x3: lateral velocity smoothness
  action_smoothness_wz: 0.001     # x3: yaw rate smoothness
  landing_velocity_coef: 2.0
  landing_precision_coef: 10.0  # bonus for landing near pad center (1.0 at center, 0.0 at edge)
  descent_speed_coef: 2.0       # penalty for exceeding max descent speed in corridor
  altitude_floor_coef: 0.3      # penalty for being below altitude floor during navigation
  time_penalty: 0.0             # per-step cost to discourage hovering
  rover_stillness_coef: 0.5    # penalty for rover speed when drone is in landing corridor
  rover_yawrate_coef: 0.5      # penalty for rover yaw rate when drone is in landing corridor
  rover_lateral_coef: 0.2     # soft penalty on body-frame lateral speed (camera faces forward)
  drone_velocity_coef: 2.0      # penalty for drone speed above max_drone_speed
  drone_xy_corridor_coef: 5.0  # penalty for drone XY speed in landing corridor (hover-then-descend)
  rover_boundary_coef: 1.0    # per-step penalty for rover at arena boundary

policy:
  value_net_sizes: [256, 256]
  cost_net_activation: "relu"
  value_activation: "relu"
  drone:
    mpc_horizon: 2
    mpc_dt: 0.02
    cost_net_sizes: [256, 256]
    state_type: "quat"         # "euler" (12D) or "quat" (13D quat+body rates)
    integrator: "rk4"          # "rk4" or "euler" (forward Euler)
    roll_pitch_max: 0.1
    yaw_max: 0.001
    pos_offset_max: 0.25
    initial_log_std: [-0.5, -0.5, -1.0, -1.3]
  rover:
    mpc_horizon: 2
    mpc_dt: 0.02
    cost_net_sizes: [256, 256]
    pos_offset_max: 0.25
    initial_log_std: [-0.6, -0.6, -0.6]  # vx, vy, ωz

training:
  timesteps: 2_000_000
  n_worlds: 128
  device: "cpu"
  seed: 42

  # PPO hyperparameters
  rollouts: 256
  learning_epochs: 4
  mini_batches: 4
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  value_loss_scale: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  kl_threshold: 0.0
  # Preprocessors (optional)
  observation_preprocessor: "RunningStandardScaler"
  state_preprocessor: "RunningStandardScaler"
  value_preprocessor: "RunningStandardScaler"

  learning_rate_scheduler: "LinearLR"
  learning_rate_scheduler_kwargs:
    start_factor: 1.0
    end_factor: 0.0333    # decay to 1e-5 (= 3e-4 * 0.0333)
    total_iters: 31250    # 2M world steps / 256 rollout * 4 scheduler steps per rollout

curriculum:
  enabled: true
  advance_threshold: 0.65
  regression_threshold: 0.3
  window_size: 100
  allow_regression: true
  levels:
    - name: "close_hover"
      landing_zone_radius: 0.10    # generous zone to learn landing
      drone_spawn:
        z_min: 0.5
        z_max: 1.0
        x_half: 0.5
        y_half: 0.5
      rover_spawn:
        stationary: true
        x_half: 0.3
        y_half: 0.3

    - name: "nearby_approach"
      landing_zone_radius: 0.09
      drone_spawn:
        z_min: 0.5
        z_max: 1.5
        x_half: 1.0
        y_half: 1.0
      rover_spawn:
        stationary: false
        max_speed: 0.3   # m/s forward body velocity (~30% of 1.0 m/s max)
        x_half: 0.5
        y_half: 0.5

    - name: "medium_rover"
      landing_zone_radius: 0.08
      drone_spawn:
        z_min: 0.5
        z_max: 1.5
        x_half: 1.5
        y_half: 1.5
      rover_spawn:
        stationary: false
        max_speed: 0.6   # m/s  (~60% of max)
        x_half: 0.5
        y_half: 0.5

    - name: "fast_rover"
      landing_zone_radius: 0.07
      drone_spawn:
        z_min: 0.5
        z_max: 1.5
        x_half: 2.5
        y_half: 2.5
      rover_spawn:
        stationary: false
        max_speed: 0.9   # m/s  (~90% of max)
        x_half: 0.7
        y_half: 0.7
      randomize_mass: true
      randomize_inertia: true
      mass_randomization_std: 0.002       # [kg]
      inertia_randomization_std: 1.0e-6   # [kg*m^2]
      enable_disturbance: true
      disturbance_force_std: 0.005         # [N]
      disturbance_torque_std: 1.0e-5      # [Nm]
  
    - name: "domain_rand"
      landing_zone_radius: 0.06
      drone_spawn:
        z_min: 0.5
        z_max: 1.5
        x_half: 3.5
        y_half: 3.5
      rover_spawn:
        stationary: false
        max_speed: 0.9   # m/s
        x_half: 1.0
        y_half: 1.0
      landing_vel_z_tol: 0.05
      randomize_mass: true
      randomize_inertia: true
      mass_randomization_std: 0.002       # [kg]
      inertia_randomization_std: 1.0e-6   # [kg*m^2]
      enable_disturbance: true
      disturbance_force_std: 0.01         # [N]
      disturbance_torque_std: 1.0e-5      # [Nm]

    - name: "full_map"
      landing_zone_radius: 0.05    # final target: tight center landing
      drone_spawn:
        z_min: 0.5
        z_max: 2.0
        x_half: 4.5
        y_half: 4.5
      rover_spawn:
        stationary: false
        max_speed: 1.0   # m/s  (full /cmd_vel vx limit)
        x_half: 2.0
        y_half: 2.0
      landing_vel_z_tol: 0.05      # m/s — tighter descent speed for final level
      randomize_mass: true
      randomize_inertia: true
      mass_randomization_std: 0.002       # [kg]
      inertia_randomization_std: 1.0e-6   # [kg*m^2]
      enable_disturbance: true
      disturbance_force_std: 0.01         # [N]
      disturbance_torque_std: 1.0e-5      # [Nm]
