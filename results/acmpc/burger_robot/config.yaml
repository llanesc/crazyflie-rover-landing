environment:
  rover_type: "burger"
  drone_model: "cf2x_T350"
  dynamics: "first_principles"
  sim_freq: 500
  mellinger_freq: 500
  control_freq: 50
  episode_length_s: 25.0
  map_size_x: 10.0
  map_size_y: 10.0
  drone_z_min: 0.0
  drone_z_max: 3.0
  rover_wheel_vel_max: 6.67    # rad/s  (MuJoCo ctrlrange)
  rover_platform_radius: 0.10
  rover_height: 0.152          # height of landing pad surface above ground [m]
  landing_z_tol: 0.05          # m — must be very close to pad surface
  landing_vel_xy_tol: 0.1     # m/s — relative to rover pad
  landing_vel_z_tol: 0.2      # m/s — max descent speed (upward rejected)
  landing_attitude_tol: 0.05  # rad (~3°) — must be nearly level
  drone_init_yaw_max: 0.1745  # rad (~10°) — random initial yaw at spawn
  # domain randomization parameters (applied only in "domain_rand" curriculum level)
  randomize_mass: false
  randomize_inertia: false
  mass_randomization_std: 0.003       # [kg]
  inertia_randomization_std: 3.0e-6   # [kg*m^2]
  enable_disturbance: false
  disturbance_force_std: 0.01         # [N]
  disturbance_torque_std: 1.0e-4      # [Nm]
  # Landing corridor
  corridor_radius: 0.3       # m — horizontal distance to activate landing phase
  corridor_transition: 0.1   # m — sigmoid blend width
  max_descent_speed: 0.2     # m/s — max descent speed in corridor
  max_drone_speed: 0.2       # m/s — drone speed above this gets penalized

rewards:
  landing: 100.0
  crash: -50.0
  boundary: -50.0
  progress_coef: 10.0
  angle_coef: 0.01
  action_smoothness_thrust: 1.0
  action_smoothness_rpy: 0.2
  action_smoothness_wheel: 0.001
  landing_velocity_coef: 2.0
  descent_speed_coef: 2.0       # penalty for exceeding max descent speed in corridor
  altitude_floor_coef: 0.3      # penalty for being below altitude floor during navigation
  time_penalty: 0.0             # per-step cost to discourage hovering
  rover_stillness_coef: 0.01    # penalty for rover speed when drone is in landing corridor
  rover_yawrate_coef: 0.01      # penalty for rover yaw rate when drone is in landing corridor
  drone_velocity_coef: 2.0      # penalty for drone speed above max_drone_speed
  drone_xy_corridor_coef: 5.0  # penalty for drone XY speed in landing corridor (hover-then-descend)
  rover_boundary_coef: 1.0    # per-step penalty for rover at arena boundary

policy:
  value_net_sizes: [256, 256]
  cost_net_activation: "relu"
  value_activation: "relu"
  drone:
    mpc_horizon: 2
    mpc_dt: 0.02
    cost_net_sizes: [256, 256]
    state_type: "euler"        # "euler" (12D) or "quat" (13D quat+body rates)
    integrator: "rk4"          # "rk4" or "euler" (forward Euler)
    roll_pitch_max: 0.1
    yaw_max: 0.05
    pos_offset_max: 0.25
    initial_log_std: [-0.5, -0.5, -1.0, -1.3]
  rover:
    mpc_horizon: 2
    mpc_dt: 0.02
    cost_net_sizes: [256, 256]
    pos_offset_max: 0.25
    initial_log_std: [-0.1, -0.1]

training:
  timesteps: 2_000_000
  n_worlds: 128
  device: "cpu"

  # PPO hyperparameters
  rollouts: 256
  learning_epochs: 4
  mini_batches: 4
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  value_loss_scale: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  kl_threshold: 0.0
  # Preprocessors (optional)
  observation_preprocessor: "RunningStandardScaler"
  state_preprocessor: "RunningStandardScaler"
  value_preprocessor: "RunningStandardScaler"

  learning_rate_scheduler: "LinearLR"
  learning_rate_scheduler_kwargs:
    start_factor: 1.0
    end_factor: 0.0333    # decay to 1e-5 (= 3e-4 * 0.0333)
    total_iters: 31250    # 2M world steps / 256 rollout * 4 scheduler steps per rollout

curriculum:
  enabled: true
  advance_threshold: 0.65
  regression_threshold: 0.3
  window_size: 100
  allow_regression: true
  levels:
    - name: "close_hover"
      drone_spawn:
        z_min: 0.5
        z_max: 1.0
        x_half: 0.5
        y_half: 0.5
      rover_spawn:
        stationary: true
        x_half: 0.3
        y_half: 0.3

    - name: "nearby_approach"
      drone_spawn:
        z_min: 0.5
        z_max: 1.5
        x_half: 1.0
        y_half: 1.0
      rover_spawn:
        stationary: false
        max_speed: 0.07   # m/s linear wheel vel  (~30% of 0.220 m/s max)

    - name: "medium_rover"
      drone_spawn:
        z_min: 0.5
        z_max: 1.5
        x_half: 1.0
        y_half: 1.0
      rover_spawn:
        stationary: false
        max_speed: 0.14   # m/s  (~60% of max)

    - name: "fast_rover"
      drone_spawn:
        z_min: 0.5
        z_max: 1.5
        x_half: 1.5
        y_half: 1.5
      rover_spawn:
        stationary: false
        max_speed: 0.20   # m/s  (~90% of max)
      randomize_mass: true
      randomize_inertia: true
      mass_randomization_std: 0.002       # [kg]
      inertia_randomization_std: 1.0e-6   # [kg*m^2]

    - name: "domain_rand"
      drone_spawn:
        z_min: 0.5
        z_max: 1.5
        x_half: 1.5
        y_half: 1.5
      rover_spawn:
        stationary: false
        max_speed: 0.20   # m/s
      randomize_mass: true
      randomize_inertia: true
      mass_randomization_std: 0.002       # [kg]
      inertia_randomization_std: 1.0e-6   # [kg*m^2]
      enable_disturbance: false

    - name: "full_map"
      drone_spawn:
        z_min: 0.5
        z_max: 2.0
        x_half: 2.0
        y_half: 2.0
      rover_spawn:
        stationary: false
        max_speed: 0.22   # m/s  (physical max: r * wheel_vel_max = 0.033 * 6.67)
      landing_vel_z_tol: 0.2      # m/s — max descent speed (upward rejected)
      randomize_mass: true
      randomize_inertia: true
      mass_randomization_std: 0.002       # [kg]
      inertia_randomization_std: 1.0e-6   # [kg*m^2]
      enable_disturbance: false
