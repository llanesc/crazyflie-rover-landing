environment:
  drone_model: "cf2x_T350"
  dynamics: "first_principles"
  sim_freq: 500
  mellinger_freq: 500
  control_freq: 50
  episode_length_s: 15.0
  map_size_x: 20.0
  map_size_y: 20.0
  drone_z_min: 0.0
  drone_z_max: 3.0
  rover_max_speed: 1.5
  rover_min_speed: -1.5
  rover_max_omega: 1.5708   # π/2 rad/s
  rover_max_accel: 2.0
  rover_platform_radius: 0.15
  rover_height: 0.1            # height of landing pad surface above ground [m]
  landing_z_tol: 0.05          # m — must be very close to pad surface
  landing_vel_xy_tol: 0.1     # m/s — relative to rover pad
  landing_vel_z_tol: 0.2      # m/s — max descent speed (upward rejected)
  landing_attitude_tol: 0.05  # rad (~3°) — must be nearly level
  randomize_mass: false
  randomize_inertia: false
  mass_randomization_std: 0.003       # [kg]
  inertia_randomization_std: 3.0e-6   # [kg*m^2]
  enable_disturbance: false
  disturbance_force_std: 0.01         # [N]
  disturbance_torque_std: 1.0e-4      # [Nm]
  # Landing corridor
  corridor_radius: 0.5       # m — horizontal distance to activate landing phase
  corridor_transition: 0.1   # m — sigmoid blend width
  max_descent_speed: 0.5     # m/s — max descent speed in corridor

rewards:
  landing: 100.0
  crash: -50.0
  boundary: -50.0
  proximity_coef: 0.1
  proximity_decay: 2.0
  angle_coef: 0.01
  action_smoothness_thrust: 1.0
  action_smoothness_rpy: 0.2
  action_smoothness_accel: 0.05
  action_smoothness_yawrate: 0.01
  landing_velocity_coef: 2.0
  descent_speed_coef: 2.0       # penalty for exceeding max descent speed in corridor
  altitude_floor_coef: 0.3      # penalty for being below altitude floor during navigation
  time_penalty: 0.0             # per-step cost to discourage hovering
  rover_stillness_coef: 0.5    # penalty for rover speed when drone is in landing corridor
  drone_velocity_coef: 0.05     # penalty for drone speed
  rover_boundary_coef: 1.0    # per-step penalty for rover at arena boundary

policy:
  value_net_sizes: [256, 256]
  cost_net_activation: "relu"
  value_activation: "relu"
  drone:
    mpc_horizon: 2
    mpc_dt: 0.02
    cost_net_sizes: [256, 256]
    roll_pitch_max: 0.2
    yaw_max: 0.1
    pos_offset_max: 0.25
    initial_log_std: [-0.5, -0.5, -1.0, -1.3]
  rover:
    mpc_horizon: 2
    mpc_dt: 0.02
    cost_net_sizes: [256, 256]
    pos_offset_max: 0.25
    initial_log_std: [-0.8, -0.8]

training:
  timesteps: 2_000_000
  n_worlds: 128
  device: "cpu"

  # PPO hyperparameters
  rollouts: 256
  learning_epochs: 4
  mini_batches: 4
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  value_loss_scale: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  kl_threshold: 0.0
  # Preprocessors (optional)
  observation_preprocessor: "RunningStandardScaler"
  state_preprocessor: "RunningStandardScaler"
  value_preprocessor: "RunningStandardScaler"

  learning_rate_scheduler: "LinearLR"
  learning_rate_scheduler_kwargs:
    start_factor: 1.0
    end_factor: 0.0333    # decay to 1e-5 (= 3e-4 * 0.0333)
    total_iters: 31250    # 2M world steps / 256 rollout * 4 scheduler steps per rollout

curriculum:
  enabled: true
  advance_threshold: 0.65
  regression_threshold: 0.3
  window_size: 100
  allow_regression: true
  levels:
    - name: "close_hover"
      drone_spawn:
        z_min: 0.5
        z_max: 1.0
        x_half: 0.5
        y_half: 0.5
      rover_spawn:
        stationary: true
        x_half: 0.3
        y_half: 0.3

    - name: "nearby_approach"
      drone_spawn:
        z_min: 0.5
        z_max: 1.5
        x_half: 1.5
        y_half: 1.5
      rover_spawn:
        stationary: false
        max_speed: 0.5

    - name: "medium_rover"
      drone_spawn:
        z_min: 0.5
        z_max: 2.0
        x_half: 2.5
        y_half: 2.5
      rover_spawn:
        stationary: false
        max_speed: 1.0

    - name: "fast_rover"
      drone_spawn:
        z_min: 0.5
        z_max: 2.0
        x_half: 3.5
        y_half: 3.5
      rover_spawn:
        stationary: false
        max_speed: 1.5
      randomize_mass: true
      randomize_inertia: true
      mass_randomization_std: 0.002       # [kg]
      inertia_randomization_std: 1.0e-6   # [kg*m^2]

    - name: "domain_rand"
      drone_spawn:
        z_min: 0.5
        z_max: 2.0
        x_half: 5.5
        y_half: 5.5
      rover_spawn:
        stationary: false
        max_speed: 1.5
      randomize_mass: true
      randomize_inertia: true
      mass_randomization_std: 0.002       # [kg]
      inertia_randomization_std: 1.0e-6   # [kg*m^2]
      enable_disturbance: false

    - name: "full_map"
      drone_spawn:
        z_min: 0.5
        z_max: 2.0
        x_half: 7.5
        y_half: 7.5
      rover_spawn:
        stationary: false
        max_speed: 1.5
      landing_vel_xy_tol: 0.05     # m/s — constrained landing velocity tolerance for fast rover
      landing_vel_z_tol: 0.2      # m/s — max descent speed (upward rejected)
      randomize_mass: true
      randomize_inertia: true
      mass_randomization_std: 0.002       # [kg]
      inertia_randomization_std: 1.0e-6   # [kg*m^2]
      enable_disturbance: false